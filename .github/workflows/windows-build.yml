name: Build Windows EXE

# Builds the self-contained Windows .exe in the cloud on a Windows runner so
# there's a ready-to-run download — no local .NET SDK needed.
on:
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish single-file self-contained exe
        run: dotnet publish windows/BiomeAlertPro/BiomeAlertPro.csproj -c Release

      - name: Upload BiomeAlertPro.exe
        uses: actions/upload-artifact@v4
        with:
          name: BiomeAlertPro-Windows
          path: windows/BiomeAlertPro/bin/Release/net8.0-windows10.0.19041.0/win-x64/publish/BiomeAlertPro.exe
          if-no-files-found: error
